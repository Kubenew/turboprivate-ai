[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "turboprivate-ai"
version = "0.1.8"
description = "Unified platform for self-hosted LLM inference + enterprise safety governance"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
authors = [
    {name = "TurboPrivate AI"},
]

dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "click>=8.1.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
inference = [
    "torch>=2.3.0",
    "transformers>=4.41.0",
    "vllm>=0.5.0",
    "outlines>=0.0.40",
    "autoawq>=0.2.0",
]
safety = [
    "scikit-learn>=1.5.0",
    "sentence-transformers>=3.0.0",
    "pgvector>=0.3.0",
]
memory = [
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "pypdf>=4.2.0",
    "pdfplumber>=0.10.0",
    "python-docx>=1.1.0",
    "beautifulsoup4>=4.12.0",
]
infra = [
    "kubernetes>=30.0.0",
    "python-terraform>=0.10.1",
    "helm-sdk>=0.1.0",
]
auth = [
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
]
observability = [
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "prometheus-client>=0.20.0",
]
worker = [
    "celery>=5.4.0",
    "redis>=5.0.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "pytest-localserver>=0.9.0",
    "ruff>=0.1",
]
full = [
    "turboprivate-ai[inference,safety,memory,infra,auth,observability,worker]",
]
all = [
    "turboprivate-ai[full,dev]",
]

[project.scripts]
turbo = "turbo.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["turbo", "worker"]

[project.urls]
Homepage = "https://github.com/Kubenew/turboprivate-ai"
Source = "https://github.com/Kubenew/turboprivate-ai"
Issues = "https://github.com/Kubenew/turboprivate-ai/issues"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
"turbo/inference/quantize.py" = ["N803", "N806"]
"tests/*" = ["N803", "N806"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
