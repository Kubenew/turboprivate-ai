services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    command: uvicorn turbo.api.main:app --host 0.0.0.0 --port 8000 --workers 4
    environment:
      - TURBO_INFERENCE__BACKEND=vllm
      - TURBO_INFERENCE__GPU_TYPE=auto
      - TURBO_SAFETY__SANDBOX=gvisor
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - model_cache:/root/.cache
      - data:/app/data

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A worker worker --loglevel=info --concurrency=4
    depends_on:
      - redis
      - postgres
    environment:
      - TURBO_INFERENCE__BACKEND=vllm

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: turboprivate
      POSTGRES_USER: turbo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data

  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"

volumes:
  model_cache:
  data:
  pgdata:
