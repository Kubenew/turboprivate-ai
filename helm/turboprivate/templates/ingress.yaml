{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "turboprivate.fullname" . }}
  namespace: {{ .Values.global.namespace }}
  labels:
    app: turboprivate
  annotations:
    {{- if .Values.ingress.tls }}
    cert-manager.io/cluster-issuer: letsencrypt-prod
    {{- end }}
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
spec:
  ingressClassName: nginx
  {{- if .Values.ingress.tls }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ include "turboprivate.fullname" . }}-tls
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: {{ include "turboprivate.fullname" . }}-api
                port:
                  number: {{ .Values.api.port }}
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "turboprivate.fullname" . }}-api
                port:
                  number: {{ .Values.api.port }}
          - path: /health
            pathType: Exact
            backend:
              service:
                name: {{ include "turboprivate.fullname" . }}-api
                port:
                  number: {{ .Values.api.port }}
          - path: /ready
            pathType: Exact
            backend:
              service:
                name: {{ include "turboprivate.fullname" . }}-api
                port:
                  number: {{ .Values.api.port }}
{{- end }}
